# GitHub Actions Workflow for rv-supply-map (Vite + React SPA → GitHub Pages)
# 4 jobs: typecheck (tsc) / test (vitest) / build (vite) / deploy (Pages)
# 2026-09-06 by Sean 10-repo-fleet Worker — v3.0.2

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps || npm install
      - name: TypeScript strict check
        run: npx tsc --noEmit
      - name: Vite build sanity
        run: npm run build
        continue-on-error: true  # build 在 lint 階段只做 sanity 檢查

  test:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps || npm install
      - name: Vitest run
        run: npm test -- --run

  build:
    name: Vite Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps || npm install
      - name: Build static site
        run: npm run build
      - name: Show dist contents
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rv-supply-map-dist
          path: web/dist/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps || npm install
        working-directory: ./web
      - run: npm run build
        working-directory: ./web
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
